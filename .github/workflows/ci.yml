name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          cat > .env << 'EOF'
          DATABASE_URL="file:./prisma/ci.db"
          AUTH_SECRET="ci-secret-ci-secret-ci-secret-32"
          ENCRYPTION_KEY="ci-encryption-key"
          DEMO_MODE="true"
          EOF
          ln -sf ../../.env apps/web/.env || true
          npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
